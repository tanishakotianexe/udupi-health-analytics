services:
  backend:
    build:
      context: ./backend
    ports:
      - "4001:4000"
    volumes:
      - ./backend/data:/app/data:ro
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

